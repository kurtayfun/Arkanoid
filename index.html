<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arkanoid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
  }

  #ui {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 420px;
    padding: 8px 12px;
    color: #ff6600;
    font-size: 13px;
    letter-spacing: 1px;
  }

  #ui span { color: #ffffff; font-size: 15px; font-weight: bold; }

  #canvas-wrapper {
    position: relative;
    border: 3px solid #334;
    box-shadow: 0 0 30px #0055ff55, inset 0 0 20px #00001188;
  }

  canvas {
    display: block;
    background: #0d0d2b;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,20,0.88);
    color: white;
    text-align: center;
    padding: 20px;
  }

  #overlay h1 {
    font-size: 2.2em;
    color: #ff6600;
    text-shadow: 0 0 20px #ff6600;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  #overlay p {
    color: #aaa;
    margin-bottom: 6px;
    font-size: 0.85em;
  }

  #overlay .subtitle {
    color: #4488ff;
    font-size: 0.9em;
    margin-bottom: 24px;
  }

  #startBtn {
    background: linear-gradient(135deg, #ff6600, #cc3300);
    border: none;
    color: white;
    font-family: 'Courier New', monospace;
    font-size: 1.1em;
    letter-spacing: 2px;
    padding: 14px 36px;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 20px #ff660066;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  #startBtn:active { transform: scale(0.96); }

  #lives-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .heart { color: #ff3366; font-size: 16px; }

  #powerup-bar {
    width: 100%;
    max-width: 420px;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    font-size: 11px;
    color: #556;
    letter-spacing: 1px;
  }

  #active-power {
    color: #ffcc00;
    font-weight: bold;
    font-size: 12px;
  }
</style>
</head>
<body>

<div id="ui">
  <div>SKOR: <span id="scoreDisplay">0</span></div>
  <div>ROUND: <span id="roundDisplay">1</span></div>
  <div id="lives-icons"></div>
</div>

<div id="canvas-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <h1>ARKANOID</h1>
    <p class="subtitle">Mobil & Masaüstü</p>
    <p>🖱️ Mouse veya parmakla paddle'ı kontrol et</p>
    <p>Tüm tuğlaları kır, sonraki raunda geç!</p>
    <br>
    <button id="startBtn" onclick="startGame()">BAŞLA ▶</button>
  </div>
</div>

<div id="powerup-bar">
  GÜÇ: <span id="active-power">—</span>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const roundDisplay = document.getElementById('roundDisplay');
const livesIcons = document.getElementById('lives-icons');
const activePower = document.getElementById('active-power');

// --- BOYUT HESAPLA ---
function calcSize() {
  const maxW = Math.min(window.innerWidth - 10, 420);
  const maxH = Math.min(window.innerHeight - 130, 680);
  const ratio = 420 / 620;
  let w = maxW;
  let h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  return { w: Math.floor(w), h: Math.floor(h) };
}

let { w: W, h: H } = calcSize();
canvas.width = W;
canvas.height = H;
document.getElementById('canvas-wrapper').style.width = W + 'px';

const COLS = 11;
const ROWS = 6;
const BRICK_ROWS_START = Math.floor(H * 0.05);
const BRICK_H = Math.floor(H * 0.04);
const BRICK_GAP = 3;
const BRICK_W = Math.floor((W - (COLS + 1) * BRICK_GAP) / COLS);

// Renk paleti (NES'e yakın)
const BRICK_COLORS = [
  { color: '#cc2200', score: 70, hp: 2 }, // kırmızı - sağlam
  { color: '#ff6600', score: 50, hp: 1 },
  { color: '#ffcc00', score: 40, hp: 1 },
  { color: '#44bb44', score: 30, hp: 1 },
  { color: '#2266ff', score: 20, hp: 1 },
  { color: '#aa44cc', score: 60, hp: 2 }, // mor - sağlam
];

const POWERUP_TYPES = [
  { type: 'wide',    color: '#00ccff', label: '⬛ GENİŞ PADDLE',  duration: 10000 },
  { type: 'laser',   color: '#ff3366', label: '🔴 LAZER',          duration: 8000  },
  { type: 'multi',   color: '#ffcc00', label: '🟡 ÇOK TOP',        duration: null  },
  { type: 'slow',    color: '#44ff88', label: '🟢 YAVAŞ TOP',      duration: 7000  },
  { type: 'life',    color: '#ff88cc', label: '💗 EKSTRA CAN',     duration: null  },
];

let state = {};
let animId;
let gameRunning = false;

function initState() {
  state = {
    score: 0,
    round: 1,
    lives: 3,
    balls: [],
    paddle: { x: W/2, w: W * 0.18, h: Math.floor(H*0.022), y: H - Math.floor(H*0.08) },
    bricks: [],
    powerups: [],
    lasers: [],
    activeEffects: {},
    powerTimer: null,
  };
  spawnBall();
  buildBricks();
}

function spawnBall(fromBall) {
  const speed = Math.min(3 + state.round * 0.3, 6) * (W / 420);
  const angle = fromBall ? (Math.random() * 60 - 30) * Math.PI/180 : -Math.PI/2 + (Math.random()*0.4-0.2);
  state.balls.push({
    x: fromBall ? fromBall.x : state.paddle.x,
    y: fromBall ? fromBall.y : state.paddle.y - 12,
    vx: Math.sin(angle) * speed,
    vy: -Math.abs(Math.cos(angle) * speed),
    r: Math.max(6, Math.floor(W * 0.016)),
    launched: !!fromBall,
  });
}

function buildBricks() {
  state.bricks = [];
  const pattern = getRoundPattern(state.round);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const typeIdx = pattern[r % pattern.length];
      const bType = BRICK_COLORS[typeIdx % BRICK_COLORS.length];
      const x = BRICK_GAP + c * (BRICK_W + BRICK_GAP);
      const y = BRICK_ROWS_START + r * (BRICK_H + BRICK_GAP);
      state.bricks.push({ x, y, w: BRICK_W, h: BRICK_H, hp: bType.hp, maxHp: bType.hp, color: bType.color, score: bType.score });
    }
  }
}

function getRoundPattern(round) {
  const patterns = [
    [4, 2, 3, 1, 0, 5],
    [5, 0, 1, 3, 2, 4],
    [0, 5, 2, 4, 1, 3],
    [3, 1, 5, 0, 4, 2],
  ];
  return patterns[(round - 1) % patterns.length];
}

// --- ÇİZİM ---
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Arka plan deseni (NES tarzı)
  ctx.fillStyle = '#0d0d2b';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  // Tuğlalar
  state.bricks.forEach(b => {
    if (b.hp <= 0) return;
    const alpha = b.hp < b.maxHp ? 0.6 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Parlaklık efekti
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(b.x, b.y, b.w, 3);
    ctx.globalAlpha = 1;
    // Kenarlık
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  });

  // Power-up'lar
  state.powerups.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x - 16, p.y - 8, 32, 16, 4);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = `bold ${Math.floor(W*0.025)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, p.x, p.y);
  });

  // Lazerler
  ctx.fillStyle = '#ff3366';
  state.lasers.forEach(l => {
    ctx.fillRect(l.x - 2, l.y, 4, 12);
  });

  // Top(lar)
  state.balls.forEach(ball => {
    // Glow
    const grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 2);
    grad.addColorStop(0, 'rgba(255,220,100,0.8)');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffcc';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Paddle
  const pw = state.paddle.w;
  const px = state.paddle.x - pw/2;
  const py = state.paddle.y;
  const ph = state.paddle.h;

  const pColor = state.activeEffects.wide ? '#00ccff' :
                 state.activeEffects.laser ? '#ff3366' : '#ff6600';

  const paddleGrad = ctx.createLinearGradient(px, py, px, py + ph);
  paddleGrad.addColorStop(0, '#ffffff');
  paddleGrad.addColorStop(0.3, pColor);
  paddleGrad.addColorStop(1, '#442200');
  ctx.fillStyle = paddleGrad;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 4);
  ctx.fill();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(30,30,80,0.5)';
  ctx.lineWidth = 0.5;
  const step = Math.floor(W / 20);
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

// --- OYUN DÖNGÜSÜ ---
function gameLoop() {
  if (!gameRunning) return;
  update();
  draw();
  animId = requestAnimationFrame(gameLoop);
}

let laserTimer = 0;

function update() {
  const p = state.paddle;

  // Topları güncelle
  state.balls.forEach((ball, bi) => {
    if (!ball.launched) {
      ball.x = p.x;
      return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Duvar çarpışması
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle çarpışması
    if (ball.vy > 0 &&
        ball.x > p.x - p.w/2 - ball.r &&
        ball.x < p.x + p.w/2 + ball.r &&
        ball.y + ball.r > p.y &&
        ball.y + ball.r < p.y + p.h + 8) {
      const hit = (ball.x - p.x) / (p.w / 2);
      const angle = hit * 65 * Math.PI / 180;
      const speed = Math.sqrt(ball.vx**2 + ball.vy**2);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.abs(Math.cos(angle) * speed);
      ball.y = p.y - ball.r;
    }

    // Alt düşme
    if (ball.y - ball.r > H) {
      state.balls.splice(bi, 1);
    }

    // Tuğla çarpışması
    state.bricks.forEach(b => {
      if (b.hp <= 0) return;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        const overlapL = (ball.x + ball.r) - b.x;
        const overlapR = (b.x + b.w) - (ball.x - ball.r);
        const overlapT = (ball.y + ball.r) - b.y;
        const overlapB = (b.y + b.h) - (ball.y - ball.r);
        const minH = Math.min(overlapL, overlapR);
        const minV = Math.min(overlapT, overlapB);
        if (minH < minV) ball.vx *= -1; else ball.vy *= -1;
        b.hp--;
        if (b.hp <= 0) {
          state.score += b.score;
          scoreDisplay.textContent = state.score;
          // Power-up şansı
          if (Math.random() < 0.18) spawnPowerup(b.x + b.w/2, b.y + b.h/2);
        }
      }
    });
  });

  // Top yoksa can düş
  if (state.balls.length === 0) {
    state.lives--;
    updateLives();
    if (state.lives <= 0) {
      endGame(false);
      return;
    }
    clearEffects();
    spawnBall();
  }

  // Tüm tuğlalar kırıldıysa
  if (state.bricks.every(b => b.hp <= 0)) {
    state.round++;
    roundDisplay.textContent = state.round;
    clearEffects();
    state.balls = [];
    state.powerups = [];
    state.lasers = [];
    buildBricks();
    spawnBall();
    showRoundMessage();
  }

  // Power-up hareketi
  state.powerups.forEach((p, i) => {
    p.y += 1.5;
    if (p.y > H) { state.powerups.splice(i, 1); return; }
    // Paddle ile çarpışma
    const pad = state.paddle;
    if (p.x > pad.x - pad.w/2 && p.x < pad.x + pad.w/2 &&
        p.y > pad.y && p.y < pad.y + pad.h) {
      applyPowerup(p.type);
      state.powerups.splice(i, 1);
    }
  });

  // Lazer
  if (state.activeEffects.laser) {
    laserTimer++;
    if (laserTimer % 20 === 0) {
      const pad = state.paddle;
      state.lasers.push({ x: pad.x - pad.w/4, y: pad.y });
      state.lasers.push({ x: pad.x + pad.w/4, y: pad.y });
    }
  }

  state.lasers.forEach((l, li) => {
    l.y -= 6;
    if (l.y < 0) { state.lasers.splice(li, 1); return; }
    state.bricks.forEach(b => {
      if (b.hp <= 0) return;
      if (l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
        b.hp--;
        if (b.hp <= 0) { state.score += b.score; scoreDisplay.textContent = state.score; }
        state.lasers.splice(li, 1);
      }
    });
  });
}

function spawnPowerup(x, y) {
  const t = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  state.powerups.push({ x, y, type: t.type, color: t.color, label: t.type.toUpperCase()[0] });
}

function applyPowerup(type) {
  const t = POWERUP_TYPES.find(p => p.type === type);
  activePower.textContent = t ? t.label : type;

  if (type === 'wide') {
    state.paddle.w = W * 0.28;
    state.activeEffects.wide = true;
    clearTimeout(state.powerTimer);
    state.powerTimer = setTimeout(() => {
      state.paddle.w = W * 0.18;
      state.activeEffects.wide = false;
      activePower.textContent = '—';
    }, 10000);
  } else if (type === 'slow') {
    state.balls.forEach(b => { b.vx *= 0.65; b.vy *= 0.65; });
    state.activeEffects.slow = true;
    clearTimeout(state.powerTimer);
    state.powerTimer = setTimeout(() => {
      state.balls.forEach(b => { b.vx *= 1.5; b.vy *= 1.5; });
      state.activeEffects.slow = false;
      activePower.textContent = '—';
    }, 7000);
  } else if (type === 'multi') {
    const existing = [...state.balls];
    existing.forEach(b => spawnBall(b));
  } else if (type === 'laser') {
    state.activeEffects.laser = true;
    clearTimeout(state.powerTimer);
    state.powerTimer = setTimeout(() => {
      state.activeEffects.laser = false;
      activePower.textContent = '—';
    }, 8000);
  } else if (type === 'life') {
    state.lives = Math.min(state.lives + 1, 5);
    updateLives();
  }
}

function clearEffects() {
  state.activeEffects = {};
  state.paddle.w = W * 0.18;
  clearTimeout(state.powerTimer);
  activePower.textContent = '—';
}

function updateLives() {
  livesIcons.innerHTML = '';
  for (let i = 0; i < state.lives; i++) {
    const s = document.createElement('span');
    s.className = 'heart';
    s.textContent = '♥';
    livesIcons.appendChild(s);
  }
}

// --- KONTROLLER ---
// Mouse
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  movePaddle(mx);
});

// Dokunmatik
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const tx = e.touches[0].clientX - rect.left;
  movePaddle(tx);
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  launchBall();
}, { passive: false });

canvas.addEventListener('click', launchBall);

function movePaddle(x) {
  const hw = state.paddle.w / 2;
  state.paddle.x = Math.max(hw, Math.min(W - hw, x));
}

function launchBall() {
  state.balls.forEach(b => b.launched = true);
}

// --- OYUN BAŞLAT / BİTİR ---
function startGame() {
  overlay.style.display = 'none';
  initState();
  updateLives();
  roundDisplay.textContent = 1;
  scoreDisplay.textContent = 0;
  gameRunning = true;
  gameLoop();
}

function endGame(win) {
  gameRunning = false;
  cancelAnimationFrame(animId);
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1>${win ? '🎉 TEBRİKLER!' : '💀 GAME OVER'}</h1>
    <p class="subtitle">${win ? 'Tüm roundları geçtin!' : 'Canların bitti!'}</p>
    <p>SKOR: <strong style="color:#ffcc00;font-size:1.4em">${state.score}</strong></p>
    <p>ROUND: ${state.round}</p>
    <br>
    <button id="startBtn" onclick="startGame()">TEKRAR OYNA ▶</button>
  `;
}

function showRoundMessage() {
  // Kısa flash mesaj
  const msg = document.createElement('div');
  msg.style.cssText = `
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#ffcc00; font-size:1.8em; font-weight:bold; font-family:Courier New;
    text-shadow: 0 0 20px #ffcc00; pointer-events:none; z-index:10;
    letter-spacing:3px;
  `;
  msg.textContent = `ROUND ${state.round}`;
  document.getElementById('canvas-wrapper').appendChild(msg);
  setTimeout(() => msg.remove(), 1500);
}

// Ekran boyutu değişince
window.addEventListener('resize', () => {
  const s = calcSize();
  if (Math.abs(s.w - W) > 20) location.reload();
});
</script>
</body>
</html>
